services:
  memkit:
    build: ./starter-kit
    ports:
      - "127.0.0.1:7070:7070"
    labels:
      takehome.persistent: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7070/v1/health')"]
      interval: 2s
      timeout: 2s
      retries: 30
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MEMKIT_URL: http://memkit:7070
      DATABASE_PATH: /data/memory.sqlite3
    volumes:
      - memory-data:/data
    depends_on:
      memkit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/health')"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  memory-data:
